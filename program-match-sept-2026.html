<!DOCTYPE html>

<style>
:root{
  --paper:#eef1f5;
  --card:#ffffff;
  --ink:#0d1b2a;
  --ink-soft:#4a5b6b;
  --rule:#c9d3dd;
  --wps:#0a4e8b;
  --down:#b0121f;
  --up:#1d6b4a;
  --flag:#ffd400;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --cond:"Barlow Semi Condensed",var(--sans);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.45;
  padding:0 0 4rem;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* ---- masthead ---- */
.mast{background:var(--wps);color:#fff;padding:18px 0 16px;margin-bottom:16px}
.mast .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mast h1{
  font-family:var(--cond);font-weight:700;font-size:34px;line-height:.95;
  margin:0;letter-spacing:-.01em;
}
.mast .cycle{font-family:var(--cond);font-weight:600;font-size:19px;color:#a8d4ff;margin:0}
.mast .clock{font-size:13px;color:#cfe6ff;margin:4px 0 0;width:100%}

/* ---- panels ---- */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:14px;margin-bottom:14px}
.panel h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0 0 8px;letter-spacing:-.005em}
.hint{font-size:14px;color:var(--ink-soft);margin:0 0 10px}
textarea{
  width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:14px;line-height:1.4;padding:10px;border:1px solid var(--rule);
  border-radius:4px;background:#fbfcfd;color:var(--ink);resize:vertical;
}
textarea:focus,button:focus-visible,summary:focus-visible,input:focus{outline:3px solid #f0a500;outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{
  font-family:var(--cond);font-weight:600;font-size:18px;
  padding:11px 20px;border-radius:4px;border:1px solid var(--wps);
  background:var(--wps);color:#fff;cursor:pointer;min-height:46px;
}
button.ghost{background:#fff;color:var(--wps)}
button:active{transform:translateY(1px)}
.err{color:var(--down);font-size:14px;margin-top:8px}

/* ---- headline story ---- */
.story{background:var(--ink);color:#fff;border:none}
.story h2{color:#8fc3f2;font-size:18px;margin-bottom:6px}
.story p{margin:0 0 10px;font-size:18px;line-height:1.4}
.story p:last-child{margin-bottom:0}
.story b{font-family:var(--cond);font-weight:700;font-size:23px}
.story .neg{color:#ff9a9a}
.story .pos{color:#8ee0b4}
.totals{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid #2c4256;padding-top:10px;margin-top:12px;font-size:14px;color:#a9bccd}
.totals span b{display:block;font-size:21px;color:#fff}

/* ---- brand rows ---- */
details.brand{border:1px solid var(--rule);border-radius:5px;background:var(--card);margin-bottom:8px;overflow:hidden}
details.brand[open]{border-color:var(--wps)}
summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
.bname{font-family:var(--cond);font-weight:600;font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdelta{font-family:var(--cond);font-weight:700;font-size:20px;white-space:nowrap}
.bdelta.d{color:var(--down)}
.bdelta.u{color:var(--up)}
.pct{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--ink-soft);margin-left:5px}
.tick{width:9px;height:34px;border-radius:2px;flex:none}
.tick.has{background:var(--wps)}
.tick.none{background:var(--rule)}
.body{padding:0 12px 13px;border-top:1px solid #e4e9ee}
.money{font-size:14px;color:var(--ink-soft);margin:9px 0 12px}
.prog{border-left:3px solid var(--wps);padding:2px 0 2px 11px;margin-bottom:14px}
.prog h4{font-family:var(--cond);font-weight:700;font-size:18px;margin:0 0 4px}
.prog ul{margin:0 0 7px;padding-left:17px;font-size:14.5px}
.prog li{margin-bottom:2px}
.pitch{background:#f4f8fc;border:1px solid #d6e5f2;border-radius:4px;padding:9px 10px;font-size:15px;margin:0}
.pitch::before{content:"Say: ";font-family:var(--cond);font-weight:600;color:var(--wps)}
.meta{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0}
.flagline{background:var(--flag);color:#241d00;font-weight:600;font-size:12.5px;padding:3px 7px;border-radius:3px;display:inline-block;margin-top:6px}
.nomatch{font-size:15px;color:var(--ink-soft);margin:9px 0 0}

.sec-h{font-family:var(--cond);font-weight:700;font-size:24px;margin:22px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.sub{font-size:14px;color:var(--ink-soft);margin:-4px 0 10px}

/* ---- browse list ---- */
#browse .prog{margin-bottom:16px}
#browse h3{font-family:var(--cond);font-weight:700;font-size:21px;margin:16px 0 7px;color:var(--wps)}
input[type=search]{width:100%;padding:11px;font-size:16px;border:1px solid var(--rule);border-radius:4px;margin-bottom:6px}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){

</style>

/* ============================================================
   Matching
   ============================================================ */
const norm = s => (s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");

function matchPrograms(reportBrand){
  const n = norm(reportBrand);
  if(!n) return null;
  for(const entry of DATA){
    for(const a of entry.aliases){
      if(n === a) return entry;
      if(a.length >= 4 && (n.startsWith(a) || n.includes(a))) return entry;
    }
  }
  return null;
}

function parseMoney(v){
  if(v == null) return NaN;
  let s = String(v).trim();
  let neg = /^\(.*\)$/.test(s) || s.startsWith("-");
  s = s.replace(/[()\-]/g,"").replace(/[$,\s]/g,"");
  if(s === "") return NaN;
  const n = parseFloat(s);
  if(isNaN(n)) return NaN;
  return neg ? -n : n;
}

function parseInput(text){
  const rows = [];
  const lines = text.split(/\r?\n/);
  for(const line of lines){
    if(!line.trim()) continue;
    const cells = line.includes("\t") ? line.split("\t") : line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    if(cells.length < 3) continue;
    const brand = cells[0].replace(/^"|"$/g,"").trim();
    if(!brand) continue;
    const ty = parseMoney(cells[1]), ly = parseMoney(cells[2]);
    if(isNaN(ty) || isNaN(ly)) continue;      // drops the header row
    if(/^totals?$/i.test(brand)) continue;    // drops a pasted totals line
    rows.push({brand, ty, ly, delta: ty - ly});
  }
  return rows;
}

const usd = n => (n<0?"-":"") + "$" + Math.abs(Math.round(n)).toLocaleString();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function progHTML(p){
  let h = '<div class="prog"><h4>' + esc(p.title) + "</h4><ul>";
  p.bullets.forEach(b => h += "<li>" + esc(b) + "</li>");
  h += '</ul><p class="pitch">' + esc(p.pitch) + "</p>";
  h += '<p class="meta">Ends ' + esc(p.ends);
  if(p.nocombine) h += " · doesn't combine with other discounts";
  h += "</p>";
  if(p.request) h += '<span class="flagline">Won\'t apply automatically — ask for it by name</span>';
  return h + "</div>";
}

function brandRow(r){
  const entry = matchPrograms(r.brand);
  const down = r.delta < 0;
  const pctBase = r.ly !== 0 ? Math.round(Math.abs(r.delta)/Math.abs(r.ly)*100) : null;
  let h = '<details class="brand"><summary>';
  h += '<span class="tick ' + (entry ? "has" : "none") + '"></span>';
  h += '<span class="bname">' + esc(r.brand) + "</span>";
  h += '<span class="bdelta ' + (down?"d":"u") + '">' + usd(r.delta);
  if(pctBase !== null) h += '<span class="pct">' + (down?"−":"+") + pctBase + "%</span>";
  h += "</span></summary><div class=\"body\">";
  h += '<p class="money">' + usd(r.ty) + " this year vs " + usd(r.ly) + " last year</p>";
  if(entry){
    entry.programs.forEach(p => h += progHTML(p));
  } else {
    h += '<p class="nomatch">No September program on this brand. If it\'s a real decline, it\'s a stocking conversation, not a promo one — ask what replaced it on the shelf.</p>';
  }
  return h + "</div></details>";
}

function render(rows){
  const out = document.getElementById("out");
  if(!rows.length){
    out.innerHTML = '<div class="panel"><h2>Nothing to match</h2><p class="hint">The paste needs three columns: brand, this year, last year. Check that the numbers came through.</p></div>';
    return;
  }
  const sorted = rows.slice().sort((a,b) => a.delta - b.delta);
  const declines = sorted.filter(r => r.delta < 0);
  const growth = sorted.filter(r => r.delta > 0).reverse();
  const flat = sorted.filter(r => r.delta === 0);

  const totalTY = rows.reduce((s,r)=>s+r.ty,0);
  const totalLY = rows.reduce((s,r)=>s+r.ly,0);
  const netDelta = totalTY - totalLY;
  const declineSum = declines.reduce((s,r)=>s+r.delta,0);

  let story = "";
  if(declines.length){
    const top = declines[0];
    const share = Math.round(Math.abs(top.delta)/Math.abs(declineSum)*100);
    story += "<p>" + esc(top.brand) + " is <b class=\"neg\">" + usd(top.delta) + "</b> and that's " +
      share + "% of everything you lost. ";
    if(share >= 50) story += "Fix that one line and the year mostly fixes itself.";
    else story += "It's the biggest piece, but the loss is spread — plan on three conversations, not one.";
    story += "</p>";
  } else {
    story += "<p>No brand is down year over year. Nice book.</p>";
  }
  if(growth.length){
    const g = growth[0];
    story += "<p>Best growth is " + esc(g.brand) + " at <b class=\"pos\">+" + usd(g.delta).replace("$","$") + "</b>. Lead with that before you bring up the rest.</p>";
  }
  story = '<div class="panel story"><h2>The read</h2>' + story +
    '<div class="totals">' +
      "<span>This year<b>" + usd(totalTY) + "</b></span>" +
      "<span>Last year<b>" + usd(totalLY) + "</b></span>" +
      "<span>Net<b class=\"" + (netDelta<0?"neg":"pos") + "\">" + (netDelta>=0?"+":"") + usd(netDelta) + "</b></span>" +
      "<span>Brands<b>" + rows.length + "</b></span>" +
    "</div></div>";

  let h = story;
  if(declines.length){
    h += '<h2 class="sec-h">Down — biggest dollars first</h2>';
    h += '<p class="sub">' + declines.filter(r=>matchPrograms(r.brand)).length + " of " + declines.length + " have a program running this month.</p>";
    declines.forEach(r => h += brandRow(r));
  }
  if(growth.length){
    h += '<h2 class="sec-h">Up</h2><p class="sub">Open with these.</p>';
    growth.forEach(r => h += brandRow(r));
  }
  if(flat.length){
    h += '<h2 class="sec-h">Flat</h2>';
    flat.forEach(r => h += brandRow(r));
  }
  out.innerHTML = h;
  out.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---- browse all ---- */
function renderBrowse(){
  let h = "";
  DATA.forEach(e => {
    h += '<div class="bgroup" data-key="' + esc((e.brand + " " + e.programs.map(p=>p.title + " " + p.bullets.join(" ")).join(" ")).toLowerCase()) + '">';
    h += "<h3>" + esc(e.brand) + "</h3>";
    e.programs.forEach(p => h += progHTML(p));
    h += "</div>";
  });
  document.getElementById("browse").innerHTML = h;
}

document.getElementById("find").addEventListener("input", function(){
  const q = this.value.trim().toLowerCase();
  document.querySelectorAll("#browse .bgroup").forEach(g => {
    g.classList.toggle("hidden", q !== "" && !g.dataset.key.includes(q));
  });
});

/* ---- controls ---- */
document.getElementById("go").addEventListener("click", () => {
  const txt = document.getElementById("in").value;
  const err = document.getElementById("err");
  const rows = parseInput(txt);
  if(!rows.length){
    err.textContent = "Couldn't read any brand rows. Paste the whole import file including the numbers.";
    err.classList.remove("hidden");
    return;
  }
  err.classList.add("hidden");
  render(rows);
  try { window.storage.set("pm:last", txt); } catch(e){}
});

document.getElementById("clr").addEventListener("click", () => {
  document.getElementById("in").value = "";
  document.getElementById("out").innerHTML = "";
  document.getElementById("err").classList.add("hidden");
  try { window.storage.delete("pm:last"); } catch(e){}
});

/* ---- clock ---- */
(function(){
  const now = new Date();
  const days = Math.ceil((CYCLE_END - now) / 86400000);
  const el = document.getElementById("clock");
  if(days > 1) el.textContent = days + " days left in the cycle — everything below expires Sept 30 unless noted.";
  else if(days === 1) el.textContent = "Last day of the cycle. Orders have to be in today.";
  else if(days === 0) el.textContent = "Cycle ends today.";
  else el.textContent = "This cycle has ended. Load the current month's specials.";
})();

renderBrowse();

/* ---- restore last paste ---- */
(async function(){
  try{
    const r = await window.storage.get("pm:last");
    if(r && r.value){
      document.getElementById("in").value = r.value;
      const rows = parseInput(r.value);
      if(rows.length) render(rows);
    }
  }catch(e){}
})();
</script>
</body>
</html>
